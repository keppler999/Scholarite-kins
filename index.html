<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scholarite | Connexion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0F172A; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #DDD; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #B45309; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-user-shield" style="font-size: 40px; color: #0F172A;"></i>
        <h2>Scholarite Access</h2>
        <p>Entrez votre code secret</p>
        <input type="text" id="accessCode" placeholder="Code SCH-XXXXXX">
        <button onclick="verifierAcces()">SE CONNECTER</button>
    </div>

    <script>
        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co"; 
        const SUPABASE_KEY = "Sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function verifierAcces() {
            const code = document.getElementById('accessCode').value;
            
            const { data, error } = await supabase
                .from('jetons_acces')
                .select('module_cible')
                .eq('code_jeton', code)
                .single();

            if (data) {
                if(data.module_cible === 'PROMOTEUR') window.location.href = "dashboard-promoteur.html";
                else if(data.module_cible === 'COMPTABLE') window.location.href = "module-comptable.html";
                else if(data.module_cible === 'PROF') window.location.href = "module-enseignant.html";
            } else {
                alert("Code invalide !");
            }
        }
    </script>
</body>
</html>
