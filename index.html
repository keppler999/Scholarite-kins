<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarite Platinum | Connexion Sécurisée</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --accent: #B45309;
            --bg: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(180, 83, 9, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(30, 41, 59, 0.5) 0%, transparent 40%);
        }

        /* CARD DE CONNEXION EFFECT VERRE */
        .login-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 32px;
            border: 1px solid rgba(180, 83, 9, 0.3);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .logo-area { margin-bottom: 40px; }
        .logo-area h1 { font-size: 28px; font-weight: 900; letter-spacing: 4px; color: var(--accent); margin: 0; }
        .logo-area p { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #64748B; margin-top: 5px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #94A3B8; margin-bottom: 8px; margin-left: 5px; }
        
        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #1E293B;
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }
        .input-field:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 15px rgba(180, 83, 9, 0.2); }

        .btn-login {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(180, 83, 9, 0.3); }

        .footer-links { margin-top: 30px; font-size: 13px; color: #64748B; }
        .footer-links a { color: var(--accent); text-decoration: none; }
    </style>
</head>
