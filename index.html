<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarite Debug | Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #0F172A; color: white; }
        .card { background: white; color: #333; padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 15px; margin: 10px 0; box-sizing: border-box; font-size: 18px; }
        button { width: 100%; padding: 15px; background: #B45309; color: white; border: none; font-weight: bold; }
        #debug-box { margin-top: 20px; padding: 10px; background: #000; color: #00FF00; font-family: monospace; font-size: 12px; border-radius: 5px; overflow-y: auto; max-height: 150px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connexion Scholarite</h2>
        <input type="text" id="tokenInput" placeholder="SCH-2026">
        <button onclick="verifierAcces()">DÉVERROUILLER</button>
    </div>

    <div id="debug-box">Système prêt... En attente d'action.</div>

    <script>
        const log = (msg) => { document.getElementById('debug-box').innerHTML += "<br>> " + msg; };

        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function verifierAcces() {
            const code = document.getElementById('tokenInput').value.trim().toUpperCase();
            log("Tentative avec : " + code);

            try {
                const { data, error } = await supabase
                    .from('jetons_acces')
                    .select('*')
                    .eq('code_jeton', code)
                    .maybeSingle();

                if (error) {
                    log("ERREUR SUPABASE : " + error.message);
                    alert("Erreur : " + error.message);
                    return;
                }

                if (data) {
                    log("SUCCESS : Jeton trouvé ! Redirection...");
                    window.location.href = "dashboard-promoteur.html";
                } else {
                    log("ÉCHEC : Code inconnu dans la table jetons_acces.");
                    alert("Code non reconnu.");
                }
            } catch (err) {
                log("ERREUR SYSTÈME : " + err.message);
            }
        }
    </script>
</body>
</html>
