<body>
    <div class="login-card">
        <div class="logo-area">
            <h1>SCHOLARITE</h1>
            <p>Platinum Edition v2.0</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label><i class="fa-solid fa-envelope"></i> Email Professionnel</label>
                <input type="email" id="email" class="input-field" placeholder="ex: direction@ecole.com" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-lock"></i> Mot de passe</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="btn-text">ACCÉDER AU SYSTÈME</button>
        </form>

        <div id="error-msg" style="color: #EF4444; font-size: 13px; margin-top: 15px; display: none;">
            Identifiants invalides ou accès non autorisé.
        </div>

        <div class="footer-links">
            <p>Besoin d'assistance ? <a href="#">Contactez l'administrateur</a></p>
            <p style="margin-top: 10px; font-size: 10px; opacity: 0.5;">ID de session sécurisé par Supabase Auth</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co";
        const SUPABASE_KEY = "sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const btnText = document.getElementById('btn-text');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnText.innerText = "VÉRIFICATION...";
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 1. Authentification
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                showError(error.message);
                return;
            }

            // 2. Récupération du profil et redirection
            handleRedirection(data.user);
        });

        async function handleRedirection(user) {
            // On cherche le rôle de l'utilisateur dans une table 'profiles'
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            if (error || !profile) {
                // Si pas de profil spécifique, on vérifie si c'est un parent
                checkIfParent(user);
                return;
            }

            // Redirection basée sur le rôle
            switch (profile.role) {
                case 'promoteur':
                    window.location.href = 'promoteur.html';
                    break;
                case 'discipline':
                case 'securite':
                    window.location.href = 'security.html';
                    break;
                default:
                    showError("Rôle non reconnu.");
            }
        }

        async function checkIfParent(user) {
            // Logique pour vérifier si l'email correspond à un parent dans la table 'students'
            const { data: student } = await supabase
                .from('students')
                .select('id')
                .eq('parent_email', user.email)
                .single();

            if (student) {
                window.location.href = 'parent.html';
            } else {
                showError("Aucun profil associé à ce compte.");
                await supabase.auth.signOut();
            }
        }

        function showError(text) {
            errorMsg.innerText = text;
            errorMsg.style.display = 'block';
            btnText.innerText = "ACCÉDER AU SYSTÈME";
        }
    </script>
</body>
</html>
