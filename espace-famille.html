<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarite | Portail Parents</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        :root {
            --family-green: #10B981;
            --bg: #F1F5F9;
            --card: #FFFFFF;
            --text: #0F172A;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }

        /* --- HEADER & PROFIL --- */
        .header { background: linear-gradient(135deg, #064E3B 0%, #10B981 100%); color: white; padding: 30px 20px; border-radius: 0 0 40px 40px; }
        .profile-section { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 65px; height: 65px; border-radius: 20px; border: 3px solid rgba(255,255,255,0.3); }

        /* --- ALERTES --- */
        .notification-bar { margin: -20px 20px 20px; background: white; padding: 18px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; border-left: 5px solid var(--warning); display: none; }

        .container { padding: 0 20px; }
        .section-title { margin: 25px 0 15px; font-size: 13px; font-weight: 800; color: #64748B; text-transform: uppercase; letter-spacing: 1px; }

        .card { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid #E2E8F0; margin-bottom: 15px; }

        /* --- FINANCES --- */
        .finance-status { display: flex; justify-content: space-between; align-items: center; }
        .progress-container { height: 12px; background: #E2E8F0; border-radius: 6px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--family-green); width: 0%; transition: 1s ease-in-out; }

        .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .grid-item { background: white; padding: 20px; border-radius: 24px; text-align: center; border: 1px solid #E2E8F0; cursor: pointer; }
        .grid-item i { font-size: 24px; color: var(--family-green); margin-bottom: 10px; }

        .stats-row { display: flex; gap: 10px; }
        .stat-box { flex: 1; padding: 15px; border-radius: 18px; text-align: center; }
        .stat-absent { background: #FEE2E2; color: var(--danger); }
        .stat-conduct { background: #ECFDF5; color: var(--family-green); }

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-link { text-align: center; color: #94A3B8; text-decoration: none; font-size: 11px; font-weight: 700; cursor: pointer; }
        .nav-link.active { color: var(--family-green); }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="profile-section">
            <img id="child-avatar" src="https://ui-avatars.com/api/?name=Eleve&background=fff&color=10B981" class="avatar">
            <div>
                <h2 id="child-name" style="font-size: 18px;">Chargement...</h2>
                <p id="child-class" style="font-size: 12px; opacity: 0.9;">Matricule : ...</p>
            </div>
        </div>
    </header>

    <div id="alert-box" class="notification-bar">
        <i class="fa-solid fa-circle-exclamation" style="color: var(--warning); font-size: 24px;"></i>
        <div>
            <p style="font-size: 13px; font-weight: 700;">Rappel de paiement</p>
            <p id="alert-text" style="font-size: 11px; color: #64748B;">Solder la tranche en cours.</p>
        </div>
    </div>

    <div class="container">
        <div class="stats-row">
            <div class="stat-box stat-absent">
                <h3 id="absences-count" style="font-size: 20px;">0</h3>
                <small>Absences</small>
            </div>
            <div class="stat-box stat-conduct">
                <h3 id="conduct-grade" style="font-size: 20px;">A</h3>
                <small>Conduite</small>
            </div>
        </div>

        <h3 class="section-title">Suivi Financier</h3>
        <div class="card">
            <div class="finance-status">
                <span style="font-weight: 700;">Frais Scolaires</span>
                <span id="payment-text" style="color: var(--family-green); font-weight: 800;">0 / 0 $</span>
            </div>
            <div class="progress-container">
                <div id="payment-bar" class="progress-bar"></div>
            </div>
            <p id="payment-footer" style="font-size: 11px; color: #64748B;">Mise à jour en temps réel</p>
        </div>

        <h3 class="section-title">Dernières Notes</h3>
        <div id="notes-container" class="card">
            <p style="font-size: 12px; color: #64748B; text-align: center;">Aucune note publiée pour le moment.</p>
        </div>

        <h3 class="section-title">Menu Rapide</h3>
        <div class="quick-grid">
            <div class="grid-item" onclick="alert('Bientôt disponible : Téléchargement PDF')">
                <i class="fa-solid fa-file-pdf"></i>
                <p style="font-size: 11px; font-weight: 700;">Bulletins</p>
            </div>
            <div class="grid-item" onclick="handleLogout()">
                <i class="fa-solid fa-power-off" style="color: var(--danger);"></i>
                <p style="font-size: 11px; font-weight: 700;">Déconnexion</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-link active"><i class="fa-solid fa-house"></i>Accueil</a>
        <a class="nav-link"><i class="fa-solid fa-chart-line"></i>Notes</a>
        <a class="nav-link"><i class="fa-solid fa-wallet"></i>Frais</a>
        <a class="nav-link" onclick="window.location.href='mailto:direction@ecole.com'"><i class="fa-solid fa-envelope"></i>Contact</a>
    </nav>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadParentDashboard() {
            // 1. Obtenir l'utilisateur connecté
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // 2. Récupérer l'élève lié (On cherche par le téléphone du parent ou email)
            // Note: Dans ta DB, assure-toi d'avoir un lien entre Parent et Elève
            const { data: student, error } = await supabase
                .from('students')
                .select('*, classes(name)')
                .eq('parent_phone', user.phone || user.email) 
                .single();

            if (student) {
                document.getElementById('child-name').innerText = student.full_name;
                document.getElementById('child-class').innerText = `${student.classes.name} | Mat: ${student.matricule}`;
                document.getElementById('child-avatar').src = `https://ui-avatars.com/api/?name=${student.full_name.replace(' ', '+')}&background=fff&color=10B981`;

                loadFinances(student.id);
                loadGrades(student.id);
            }
        }

        async function loadFinances(studentId) {
            // On calcule le total payé
            const { data: payments } = await supabase
                .from('payments')
                .select('amount')
                .eq('student_id', studentId);

            const totalPaid = payments ? payments.reduce((acc, p) => acc + parseFloat(p.amount), 0) : 0;
            const totalRequired = 450; // Montant fixe annuel (exemple)
            const percent = (totalPaid / totalRequired) * 100;

            document.getElementById('payment-text').innerText = `${totalPaid} / ${totalRequired} $`;
            document.getElementById('payment-bar').style.width = percent + '%';
            
            if (percent < 50) {
                document.getElementById('alert-box').style.display = 'flex';
                document.getElementById('payment-footer').innerText = `Reste à payer : ${totalRequired - totalPaid} $`;
            }
        }

        async function loadGrades(studentId) {
            const { data: grades } = await supabase
                .from('grades')
                .select('*')
                .eq('student_id', studentId)
                .order('created_at', { ascending: false })
                .limit(3);

            if (grades && grades.length > 0) {
                const container = document.getElementById('notes-container');
                container.innerHTML = grades.map(g => `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #f1f1f1; padding-bottom: 8px;">
                        <span style="font-size: 13px;">${g.subject || 'Examen'}</span>
                        <b style="color: ${g.score >= 10 ? 'var(--family-green)' : 'var(--danger)'};">${g.score}/20</b>
                    </div>
                `).join('');
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        window.onload = loadParentDashboard;
    </script>
</body>
</html>
