<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum Security | Centre de Contrôle</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap');

        :root {
            --bg-ultra: #020617;
            --card-glass: rgba(15, 23, 42, 0.9);
            --accent-gold: #B45309;
            --danger-red: #991B1B;
            --safe-green: #059669;
            --text-main: #F8FAFC;
            --text-dim: #64748B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; background: var(--bg-ultra); 
            color: var(--text-main); display: flex; height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle at 100% 100%, #1e293b 0%, #020617 100%);
        }

        /* --- SIDEBAR --- */
        .sidebar-auth { 
            width: 280px; background: #000; border-right: 1px solid rgba(180, 83, 9, 0.2); 
            display: flex; flex-direction: column; padding: 40px 20px;
        }
        .sidebar-auth h2 { font-size: 12px; letter-spacing: 3px; color: var(--accent-gold); margin-bottom: 50px; font-weight: 800; }
        
        .nav-item { 
            padding: 18px 20px; border-radius: 12px; cursor: pointer; color: var(--text-dim); 
            transition: 0.3s; display: flex; align-items: center; gap: 15px; margin-bottom: 10px;
            font-size: 13px; font-weight: 600;
        }
        .nav-item:hover, .nav-item.active { background: rgba(180, 83, 9, 0.1); color: #fff; }

        .main-auth { flex-grow: 1; padding: 40px; overflow-y: auto; position: relative; }

        /* --- CHAT ENGINE --- */
        .chat-layout {
            display: flex; flex-direction: column; height: 85vh;
            background: #000; border-radius: 24px; border: 1px solid rgba(153, 27, 27, 0.3);
            overflow: hidden;
        }
        .chat-header { 
            padding: 20px 25px; background: rgba(153, 27, 27, 0.05); border-bottom: 1px solid rgba(153, 27, 27, 0.2);
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .bubble {
            max-width: 70%; padding: 12px 18px; border-radius: 15px; font-size: 13.5px; line-height: 1.5;
            position: relative; animation: slideIn 0.2s ease;
        }
        .bubble.received { background: #1e293b; border-left: 4px solid var(--danger-red); align-self: flex-start; }
        .bubble.sent { background: rgba(180, 83, 9, 0.15); border-right: 4px solid var(--accent-gold); align-self: flex-end; }
        
        .bubble-meta { font-size: 9px; color: var(--text-dim); margin-bottom: 4px; font-weight: 800; text-transform: uppercase; }

        .chat-input-area { 
            padding: 20px; background: #0a0f1d; border-top: 1px solid rgba(255,255,255,0.05); 
            display: flex; gap: 12px; 
        }
        .chat-input-area input { 
            flex-grow: 1; background: #000; border: 1px solid #1e293b; color: white; 
            padding: 12px 20px; border-radius: 10px; font-family: 'JetBrains Mono', monospace;
        }
        .btn-send { 
            background: var(--accent-gold); border: none; color: white; 
            padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: 800;
        }

        .pulse-red { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(153, 27, 27, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(153, 27, 27, 0); } 100% { box-shadow: 0 0 0 0 rgba(153, 27, 27, 0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
    <aside class="sidebar-auth">
        <h2>PLATINUM SECURITY</h2>
        <div class="nav-item active" onclick="switchView('matrix', this)"><i class="fa-solid fa-shield-halved"></i> Matrice de Contrôle</div>
        <div class="nav-item pulse-red" onclick="switchView('refoulement', this)">
            <i class="fa-solid fa-bullhorn"></i> Canal Refoulement
            <span id="badge-count" style="display:none; background:var(--danger-red); color:white; font-size:9px; padding:2px 6px; border-radius:10px; margin-left:8px">LIVE</span>
        </div>
        <div class="nav-item" onclick="switchView('audit', this)"><i class="fa-solid fa-fingerprint"></i> Audit Systèmes</div>
    </aside>

    <main class="main-auth">
        <section id="view-matrix" class="view-panel">
            <h1 style="margin-bottom: 30px;">Architecture des Permissions</h1>
            <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                </div>
        </section>

        <section id="view-refoulement" class="view-panel" style="display:none; height:100%">
            <div class="chat-layout">
                <div class="chat-header">
                    <div>
                        <h3 style="color:var(--danger-red); font-size:14px">CANAL SÉCURISÉ : COMPTABILITÉ ⇄ DISCIPLINE</h3>
                        <p style="font-size:10px; color:var(--text-dim)">Protocoles de sortie active</p>
                    </div>
                </div>
                
                <div class="chat-messages" id="messages-container">
                    </div>

                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="Matricule de l'élève ou instruction de sortie...">
                    <button class="btn-send" onclick="sendToSupabase()">TRANSMETTRE</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRole = "Comptable"; // À dynamiser selon le login

        function switchView(id, el) {
            document.querySelectorAll('.view-panel').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + id).style.display = (id === 'refoulement') ? 'flex' : 'block';
            el.classList.add('active');
            if(id === 'refoulement') {
                document.getElementById('badge-count').style.display = 'none';
                loadChatHistory();
            }
        }

        // --- TEMPS RÉEL (REALTIME) ---
        const chatSubscription = supabase
            .channel('public:chat_refoulement')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_refoulement' }, payload => {
                const msg = payload.new;
                appendBubble(msg.sender, msg.content, msg.sender === currentRole ? 'sent' : 'received');
                if (msg.sender !== currentRole) playAlert();
            })
            .subscribe();

        async function loadChatHistory() {
            const { data } = await supabase.from('chat_refoulement').select('*').order('created_at', { ascending: true });
            const container = document.getElementById('messages-container');
            container.innerHTML = "";
            if(data) data.forEach(msg => appendBubble(msg.sender, msg.content, msg.sender === currentRole ? 'sent' : 'received'));
        }

        async function sendToSupabase() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if(!content) return;

            const { error } = await supabase.from('chat_refoulement').insert([
                { sender: currentRole, content: content, type: 'alert' }
            ]);

            if(!error) input.value = "";
        }

        function appendBubble(sender, text, type) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = `bubble ${type}`;
            div.innerHTML = `
                <div class="bubble-meta">${sender} • MAINTENANT</div>
                <div>${text}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function playAlert() {
            new Audio('https://www.soundjay.com/buttons/beep-07.mp3').play();
            document.getElementById('badge-count').style.display = 'inline';
        }
    </script>
</body>
</html>
