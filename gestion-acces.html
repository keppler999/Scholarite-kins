<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scholarite | Gestion des Accès</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #0F172A;
            --gold: #B45309;
            --slate: #64748B;
            --bg: #F1F5F9;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            background: var(--white);
            width: 950px;
            height: 600px;
            border-radius: 24px;
            display: flex;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--navy);
            padding: 30px 20px;
            color: white;
        }

        .brand { font-size: 22px; font-weight: 800; margin-bottom: 40px; }

        .main { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; overflow-y: auto; }

        .connection-status {
            font-size: 12px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status-online { color: #10B981; }

        .gen-card {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .form-row { display: flex; gap: 15px; }

        input, select {
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            outline: none;
        }

        input { flex-grow: 1; }

        .btn-gen {
            background: var(--gold);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-gen:hover { background: #92400E; }

        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #F1F5F9;
            background: white;
        }
        
        .token-code {
            font-family: monospace;
            background: #F1F5F9;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            color: var(--navy);
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="sidebar">
            <div class="brand"><i class="fa-solid fa-graduation-cap"></i> Scholarite</div>
            <p style="font-size: 12px; color: #94A3B8;">CONSOLE D'ADMINISTRATION</p>
        </div>

        <div class="main">
            <div class="connection-status">
                <i class="fa-solid fa-circle status-online"></i> Système Connecté au Cloud
            </div>

            <div class="gen-card">
                <h3>Générer un Jeton d'Accès</h3>
                <div class="form-row">
                    <select id="roleSelect">
                        <option value="PROF">PROFESSEUR</option>
                        <option value="COMPTABLE">COMPTABLE</option>
                    </select>
                    <input type="text" id="nameInput" placeholder="Nom du destinataire">
                    <button class="btn-gen" id="genBtn" onclick="saveTokenToDatabase()">CRÉER L'ACCÈS</button>
                </div>
            </div>

            <div id="tokenList">
                <p style="text-align: center; color: #94A3B8;">Chargement des accès...</p>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION SUPABASE (Déjà remplie avec tes clés)
        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co"; 
        const SUPABASE_KEY = "Sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z"; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fonction pour générer un code aléatoire
        function generateRandomCode() {
            return 'SCH-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // ENREGISTREMENT DANS SUPABASE
        async function saveTokenToDatabase() {
            const name = document.getElementById('nameInput').value;
            const role = document.getElementById('roleSelect').value;
            const btn = document.getElementById('genBtn');

            if(!name) return alert("Veuillez saisir un nom.");

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>...';

            const newCode = generateRandomCode();

            const { error } = await supabase
                .from('jetons_acces')
                .insert([{ code_jeton: newCode, module_cible: role, nom_destinataire: name, statut: 'DISPONIBLE' }]);

            if (error) {
                alert("Erreur : " + error.message);
            } else {
                document.getElementById('nameInput').value = "";
                fetchTokens(); 
            }
            btn.disabled = false;
            btn.innerHTML = "CRÉER L'ACCÈS";
        }

        // RÉCUPÉRATION DES JETONS
        async function fetchTokens() {
            const { data } = await supabase
                .from('jetons_acces')
                .select('*')
                .order('cree_at', { ascending: false });

            if (data) {
                const list = document.getElementById('tokenList');
                list.innerHTML = "<h4>Accès Actifs</h4>";
                data.forEach(token => {
                    const div = document.createElement('div');
                    div.className = 'token-item';
                    div.innerHTML = `
                        <div><strong>${token.nom_destinataire}</strong> <small>(${token.module_cible})</small></div>
                        <div class="token-code">${token.code_jeton}</div>
                    `;
                    list.appendChild(div);
                });
            }
        }

        // Lancer la récupération au démarrage
        fetchTokens();
    </script>
</body>
</html>
