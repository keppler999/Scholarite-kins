<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarite | Tableau de Bord Stratégique</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #0F172A;
            --gold: #B45309;
            --emerald: #10B981;
            --rose: #E11D48;
            --bg: #F8FAFC;
            --white: #FFFFFF;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--navy); }

        .sidebar { width: 260px; background: var(--navy); height: 100vh; color: white; padding: 30px 20px; position: fixed; }
        .brand { font-size: 24px; font-weight: 800; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px; margin-bottom: 10px; cursor: pointer; border-radius: 8px; transition: 0.3s; color: #94A3B8; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: white; }

        .main-content { margin-left: 300px; padding: 40px; width: calc(100% - 380px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border-top: 5px solid var(--gold); }
        .stat-label { font-size: 12px; color: #64748B; text-transform: uppercase; font-weight: 700; }
        .stat-value { font-size: 28px; font-weight: 800; margin-top: 10px; display: block; }

        .box { background: var(--white); padding: 30px; border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); margin-bottom: 30px; }
        
        .btn-refresh { 
            background: var(--navy); color: white; border: none; padding: 12px 20px; 
            border-radius: 10px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .btn-refresh:hover { background: #000; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="brand"><i class="fa-solid fa-graduation-cap"></i> Scholarite</div>
        <div class="nav-item active"><i class="fa-solid fa-chart-line"></i> Vue Stratégique</div>
        <div class="nav-item"><i class="fa-solid fa-money-bill-wave"></i> Finances</div>
        <div class="nav-item"><i class="fa-solid fa-user-graduate"></i> Élèves</div>
    </nav>

    <main class="main-content">
        <header class="header">
            <div>
                <h1 style="margin:0;">Rapport de Direction</h1>
                <p style="color: #64748B;">Données consolidées de l'établissement</p>
            </div>
            <button class="btn-refresh" onclick="actualiserTout()">
                <i class="fa-solid fa-sync-alt"></i> SYNCHRONISER
            </button>
        </header>

        <div class="grid-stats">
            <div class="stat-card">
                <span class="stat-label">Effectif Total</span>
                <span class="stat-value" id="valeurEffectif">0</span>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Recettes (FC)</span>
                <span class="stat-value" id="valeurRecettes" style="color: var(--emerald);">0 FC</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Moyenne Générale</span>
                <span class="stat-value" id="valeurMoyenne" style="color: var(--gold);">0.00 %</span>
            </div>
        </div>

        <div class="box">
            <h3><i class="fa-solid fa-history"></i> Activités Récentes</h3>
            <div id="listeActivite">
                <p style="color: #94A3B8;">Analyse des données en cours...</p>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co"; 
        const SUPABASE_KEY = "Sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function actualiserTout() {
            // --- A. CALCUL DE LA MOYENNE GÉNÉRALE ---
            const { data: notes, error: nError } = await supabase
                .from('notes')
                .select('valeur_note');

            if (!nError && notes && notes.length > 0) {
                const sommeNotes = notes.reduce((acc, curr) => acc + Number(curr.valeur_note), 0);
                const moyenneCalculée = (sommeNotes / notes.length).toFixed(2);
                document.getElementById('valeurMoyenne').innerText = moyenneCalculée + " %";
            } else {
                document.getElementById('valeurMoyenne').innerText = "N/A";
            }

            // --- B. CALCUL DES RECETTES ---
            const { data: finances, error: fError } = await supabase
                .from('finances')
                .select('montant_paye');

            if (!fError && finances) {
                const totalRecettes = finances.reduce((acc, curr) => acc + Number(curr.montant_paye), 0);
                document.getElementById('valeurRecettes').innerText = totalRecettes.toLocaleString('fr-FR') + " FC";
            }

            // --- C. COMPTAGE DES ÉLÈVES ---
            const { count, error: eError } = await supabase
                .from('eleves')
                .select('*', { count: 'exact', head: true });

            if (!eError) {
                document.getElementById('valeurEffectif').innerText = count;
            }

            // --- D. HISTORIQUE RAPIDE ---
            const { data: logs } = await supabase
                .from('finances')
                .select('*')
                .order('date_paiement', { ascending: false })
                .limit(3);

            if(logs) {
                const container = document.getElementById('listeActivite');
                container.innerHTML = logs.map(l => `
                    <div style="padding:10px 0; border-bottom:1px solid #F1F5F9; font-size:14px;">
                        <i class="fa-solid fa-check-circle" style="color:var(--emerald)"></i> 
                        Encaissement de <strong>${l.montant_paye} FC</strong> pour ${l.nom_eleve}
                    </div>
                `).join('');
            }
        }

        // Lancer au démarrage
        window.onload = actualiserTout;
    </script>
</body>
</html>
