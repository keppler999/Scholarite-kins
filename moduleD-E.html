<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarite | Direction des Études & Pédagogie</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono&display=swap');

        :root {
            --primary: #8B5CF6; /* Violet Royal */
            --bg: #020617;
            --panel: #0F172A;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 280px; background: #000; border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; }
        .nav-section { margin-bottom: 25px; }
        .nav-label { font-size: 10px; color: #64748B; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .nav-link { padding: 12px; border-radius: 10px; color: #94A3B8; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.3s; margin-bottom: 5px; }
        .nav-link.active, .nav-link:hover { background: rgba(139, 92, 246, 0.1); color: var(--primary); }

        /* --- MAIN --- */
        .main { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .top-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); padding: 20px; border-radius: 20px; border: 1px solid var(--border); }
        .stat-card h3 { font-family: 'JetBrains Mono'; font-size: 24px; margin: 10px 0; }
        .indicator { width: 100%; height: 4px; background: #1E293B; border-radius: 2px; margin-top: 10px; overflow: hidden; }

        /* --- WORKSPACE --- */
        .glass-card { background: var(--panel); border-radius: 24px; padding: 25px; border: 1px solid var(--border); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #64748B; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 13px; }

        .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: white; }

        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; }
        .status-verified { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-waiting { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="margin-bottom: 35px; display: flex; align-items: center; gap: 12px;">
            <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px;">D</div>
            <div><h2 style="font-size: 15px; letter-spacing: -0.5px;">DIRECTION ÉTUDES</h2><small style="color: var(--primary); font-size: 9px; font-weight: 800;">PLATINUM SYSTEM</small></div>
        </div>

        <div class="nav-section">
            <span class="nav-label">Pédagogie</span>
            <div class="nav-link active"><i class="fa-solid fa-stamp"></i> Validation Cotes</div>
            <div class="nav-link"><i class="fa-solid fa-list-check"></i> Suivi Programme</div>
        </div>

        <div class="nav-section">
            <span class="nav-label">Palmarès</span>
            <div class="nav-link" onclick="generateClassReport()"><i class="fa-solid fa-file-pdf"></i> Générer Bulletins</div>
        </div>

        <div style="margin-top: auto; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; font-size: 11px;">
            <p id="db-status"><i class="fa-solid fa-database"></i> Connexion : <span style="color:var(--danger)">Hors-ligne</span></p>
        </div>
    </aside>

    <main class="main">
        <div class="top-stats">
            <div class="stat-card">
                <small>Cotes Encodées</small>
                <h3 id="stat-encoded">0%</h3>
                <div class="indicator"><div id="bar-encoded" style="width: 0%; background: var(--success); height: 100%;"></div></div>
            </div>
            <div class="stat-card">
                <small>Moyenne Générale</small>
                <h3>12.8 / 20</h3>
            </div>
            <div class="stat-card">
                <small>Élèves à Risque</small>
                <h3 style="color: var(--danger)">14</h3>
            </div>
            <div class="stat-card">
                <small>Session active</small>
                <h3>1ère Période</h3>
            </div>
        </div>

        <section class="glass-card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h2>Scellement des Notes</h2>
                <button class="btn btn-primary" onclick="fetchData()"><i class="fa-solid fa-arrows-rotate"></i> Rafraîchir</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ENSEIGNANT</th>
                        <th>CLASSE</th>
                        <th>MATIÈRE</th>
                        <th>STATUT</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="val-body">
                    </tbody>
            </table>
        </section>
    </main>

    <script>
        // --- CONFIGURATION SUPABASE ---
        // Remplace par tes vrais identifiants Supabase (URL et Clé API)
        const SUPABASE_URL = "https://TON_PROJET.supabase.co";
        const SUPABASE_KEY = "TA_CLE_ANON_PUBLIC";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let schoolData = [];

        async function checkConnection() {
            try {
                const { data, error } = await supabase.from('students').select('count', { count: 'exact', head: true });
                if (!error) {
                    document.getElementById('db-status').innerHTML = '<i class="fa-solid fa-database"></i> Connexion : <span style="color:var(--success)">Connecté</span>';
                    fetchData();
                }
            } catch (e) {
                console.error("Erreur de connexion DB");
            }
        }

        async function fetchData() {
            // Ici, on récupère les notes ou les validations en attente
            const { data, error } = await supabase
                .from('evaluations')
                .select('*');

            if (data) {
                schoolData = data;
                renderTable();
                updateStats();
            }
        }

        function renderTable() {
            const body = document.getElementById('val-body');
            if (schoolData.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center">Aucune donnée trouvée dans Supabase</td></tr>';
                return;
            }
            body.innerHTML = schoolData.map((item, index) => `
                <tr>
                    <td><b>Prof. ${item.prof_name}</b></td>
                    <td>${item.class_id}</td>
                    <td>${item.subject}</td>
                    <td><span class="status-pill ${item.is_sealed ? 'status-verified' : 'status-waiting'}">
                        ${item.is_sealed ? 'SCELLÉ' : 'EN ATTENTE'}
                    </span></td>
                    <td>
                        ${!item.is_sealed ? `<button class="btn btn-success" onclick="sealGrades('${item.id}')">SCELLER</button>` : '<i class="fa-solid fa-lock"></i>'}
                    </td>
                </tr>
            `).join('');
        }

        async function sealGrades(id) {
            const { error } = await supabase
                .from('evaluations')
                .update({ is_sealed: true })
                .eq('id', id);
            
            if (!error) fetchData();
        }

        function updateStats() {
            const sealedCount = schoolData.filter(d => d.is_sealed).length;
            const percent = schoolData.length > 0 ? Math.round((sealedCount / schoolData.length) * 100) : 0;
            document.getElementById('stat-encoded').innerText = percent + "%";
            document.getElementById('bar-encoded').style.width = percent + "%";
        }

        function generateClassReport() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(20);
            doc.text("PALMARÈS OFFICIEL - 1ÈRE PÉRIODE", 105, 20, { align: 'center' });
            
            const rows = [
                ["NOM DE L'ÉLÈVE", "CLASSE", "POURCENTAGE", "RÉSULTAT"],
                ["KABAMBA Marc", "3e Élec", "84.5%", "RÉUSSITE"],
                ["MUKENDI Alice", "3e Élec", "78.2%", "RÉUSSITE"],
                ["TSHIMANGA David", "4e Comm", "42.0%", "ÉCHEC"]
            ];

            doc.autoTable({
                startY: 50,
                head: [rows[0]],
                body: rows.slice(1),
                theme: 'striped',
                headStyles: { fillColor: [139, 92, 246] }
            });

            doc.save("Bulletin_Global.pdf");
        }

        window.onload = checkConnection;
    </script>
</body>
</html>
