            margin-bottom: 30px;
            border-left: 5px solid var(--gold);
        }

            text-align: center;

        }

        .btn-save {

            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            float: right;
            margin-top: 20px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: #D1FAE5;
            color: #065F46;
