<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum ERP | Comptabilité Souveraine</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap');

        :root {
            --gold: #B45309;
            --bg: #020617;
            --panel: #0F172A;
            --success: #10B981;
            --danger: #EF4444;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px; background: #000; border-right: 1px solid var(--border);
            padding: 30px; display: flex; flex-direction: column;
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .logo-box { width: 45px; height: 45px; border-radius: 12px; background: var(--panel); object-fit: contain; border: 1px solid var(--gold); }

        .nav-link {
            padding: 15px; border-radius: 12px; color: #64748B; cursor: pointer;
            display: flex; align-items: center; gap: 15px; transition: 0.3s; margin-bottom: 8px;
            font-size: 13px; font-weight: 600;
        }
        .nav-link.active, .nav-link:hover { background: rgba(180, 83, 9, 0.1); color: var(--gold); }

        /* --- MAIN INTERFACE --- */
        .content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .kpi-card { background: var(--panel); padding: 25px; border-radius: 20px; border: 1px solid var(--border); position: relative; }
        .kpi-card::after { content: ''; position: absolute; left: 0; top: 25%; height: 50%; width: 4px; background: var(--gold); border-radius: 0 4px 4px 0; }
        .kpi-card small { color: #64748B; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .kpi-card h2 { font-family: 'JetBrains Mono'; margin-top: 10px; font-size: 22px; }

        /* --- TABLEAU --- */
        .workspace { background: var(--panel); border-radius: 24px; padding: 30px; border: 1px solid var(--border); }
        .search-bar { width: 100%; background: #000; border: 1px solid #1E293B; padding: 15px; border-radius: 12px; color: white; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #64748B; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 14px; }

        /* --- ACTIONS --- */
        .btn { padding: 8px 15px; border-radius: 8px; cursor: pointer; border: none; font-weight: 700; font-size: 11px; transition: 0.2s; }
        .btn-pay { background: var(--success); color: white; }
        .btn-kick { background: var(--danger); color: white; margin-left: 5px; }
        .btn-pdf { background: #1E293B; color: white; margin-right: 5px; }

        /* --- MODAL --- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--panel); padding: 40px; border-radius: 28px; width: 450px; border: 1px solid rgba(180, 83, 9, 0.4); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img id="side-logo" src="" class="logo-box">
            <div>
                <h3 id="side-sch-name" style="font-size: 14px;">SCHOLARITE</h3>
                <small style="color: var(--gold)">Module Comptable</small>
            </div>
        </div>
        <div class="nav-link active"><i class="fa-solid fa-cash-register"></i> Caisse Directe</div>
        <div class="nav-link"><i class="fa-solid fa-list-check"></i> Recouvrement</div>
        <div class="nav-link"><i class="fa-solid fa-file-pdf"></i> Rapports Journaliers</div>
        <div class="nav-link" style="margin-top: auto; color: var(--danger);" onclick="window.location.href='index.html'"><i class="fa-solid fa-power-off"></i> Déconnexion</div>
    </aside>

    <main class="content">
        <div class="kpi-grid">
            <div class="kpi-card"><small>Caisse du Jour</small><h2 id="day-cash">0.00 $</h2></div>
            <div class="kpi-card"><small>Encaissement Total</small><h2 id="total-cash">0.00 $</h2></div>
            <div class="kpi-card"><small>Solvabilité Globale</small><h2 id="rate-cash">0%</h2></div>
            <div class="kpi-card"><small>Alertes Refoulement</small><h2 id="kick-count" style="color: var(--danger)">0</h2></div>
        </div>

        <div class="workspace">
            <input type="text" class="search-bar" placeholder="Rechercher un élève (Nom ou Matricule)..." onkeyup="filterTable(this.value)">
            <table>
                <thead>
                    <tr>
                        <th>NOM DE L'ÉLÈVE</th>
                        <th>OPTION / CLASSE</th>
                        <th>TOTAL PAYÉ</th>
                        <th>RESTE À PAYER</th>
                        <th>STATUS</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="registry"></tbody>
            </table>
        </div>
    </main>

    <div class="overlay" id="pay-modal">
        <div class="modal">
            <h2 style="margin-bottom: 10px; font-weight: 800;">ENCAISSEMENT</h2>
            <p id="target-student" style="color: var(--gold); margin-bottom: 30px; font-weight: 600; font-size: 18px;"></p>
            
            <div style="margin-bottom: 25px;">
                <label style="font-size: 11px; color: #64748B;">MONTANT DU VERSEMENT (USD)</label>
                <input type="number" id="cash-in" placeholder="0.00" style="width:100%; padding:18px; background:#000; border:1px solid #1E293B; color:white; border-radius:12px; margin-top:10px; font-size:24px; font-family:'JetBrains Mono';">
            </div>

            <div style="display: flex; gap: 12px;">
                <button class="btn-pay" style="flex-grow: 1; padding: 18px; font-size: 14px;" onclick="processPayment()">CONFIRMER LE PAIEMENT</button>
                <button class="btn" style="background:#1E293B; color:white; padding: 18px;" onclick="closeModal()">ANNULER</button>
            </div>
        </div>
    </div>

    <script>
        // --- INITIALISATION ---
        const config = JSON.parse(localStorage.getItem('platinum_config')) || { schoolName: "Scholarite", totalFees: 450 };
        let activeStudent = null;

        // Simulation de données (À lier à ta table 'students' Supabase)
        let students = [
            { id: 1, name: "KABAMBA Marc", class: "3e Électricité", paid: 150, total: config.totalFees },
            { id: 2, name: "MUKENDI Alice", class: "3e Électricité", paid: 450, total: config.totalFees },
            { id: 3, name: "TSHIMANGA David", class: "4e Commerciale", paid: 50, total: config.totalFees }
        ];

        window.onload = () => {
            document.getElementById('side-logo').src = config.logo || '';
            document.getElementById('side-sch-name').innerText = config.schoolName.toUpperCase();
            renderRegistry();
            updateKPIs();
        };

        // --- FONCTIONS CORE ---
        function renderRegistry(data = students) {
            const tbody = document.getElementById('registry');
            tbody.innerHTML = data.map(s => {
                const rest = s.total - s.paid;
                const status = rest <= 0 
                    ? '<span style="background:rgba(16,185,129,0.1); color:var(--success); padding:4px 8px; border-radius:6px; font-size:11px; font-weight:800;">SOLVABLE</span>' 
                    : '<span style="background:rgba(239,68,68,0.1); color:var(--danger); padding:4px 8px; border-radius:6px; font-size:11px; font-weight:800;">EN DETTE</span>';
                
                return `
                    <tr>
                        <td><b style="letter-spacing:0.5px">${s.name}</b></td>
                        <td style="color:#64748B">${s.class}</td>
                        <td style="font-family:'JetBrains Mono'">${s.paid.toFixed(2)} $</td>
                        <td style="font-family:'JetBrains Mono'; color:${rest > 0 ? 'var(--danger)' : 'white'}">${rest.toFixed(2)} $</td>
                        <td>${status}</td>
                        <td>
                            <button class="btn btn-pdf" title="Réimprimer Reçu" onclick="generateReceipt('${s.name}', 0, true)">📜</button>
                            <button class="btn btn-pay" onclick="openPay(${s.id})">PAYER</button>
                            <button class="btn btn-kick" title="Alerte Refoulement" onclick="triggerKick('${s.name}')"><i class="fa-solid fa-user-slash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable(val) {
            const filtered = students.filter(s => s.name.toLowerCase().includes(val.toLowerCase()));
            renderRegistry(filtered);
        }

        // --- LOGIQUE PAIEMENT ---
        function openPay(id) {
            activeStudent = students.find(s => s.id === id);
            document.getElementById('target-student').innerText = activeStudent.name;
            document.getElementById('pay-modal').style.display = 'flex';
        }

        function processPayment() {
            const amount = parseFloat(document.getElementById('cash-in').value);
            if(!amount || amount <= 0) return alert("Veuillez saisir un montant valide.");
            
            activeStudent.paid += amount;
            generateReceipt(activeStudent.name, amount);
            
            // Notification visuelle
            alert(`Paiement de ${amount}$ enregistré. Le reçu PDF a été généré.`);
            
            closeModal();
            renderRegistry();
            updateKPIs();
            document.getElementById('cash-in').value = "";
        }

        // --- GÉNÉRATION DU REÇU PDF ---
        function generateReceipt(studentName, amount, isDuplicate = false) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ format: [100, 150] }); // Format ticket
            const date = new Date().toLocaleString('fr-FR');

            // Header
            doc.setFillColor(15, 23, 42); 
            doc.rect(0, 0, 100, 30, 'F');
            
            doc.setTextColor(180, 83, 9);
            doc.setFontSize(14);
            doc.text(config.schoolName || "SCHOLARITE", 50, 15, { align: "center" });
            doc.setFontSize(8);
            doc.text(config.slogan || "L'excellence par le travail", 50, 22, { align: "center" });
            
            // Corps
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(10);
            doc.text(isDuplicate ? "DUPLICATA DE REÇU" : "REÇU DE PAIEMENT OFFICIEL", 50, 45, { align: "center" });
            
            doc.setFontSize(8);
            doc.text(`Date : ${date}`, 10, 60);
            doc.setFontSize(10);
            doc.text(`ÉLÈVE : ${studentName}`, 10, 75);
            doc.text(`MONTANT : ${amount.toFixed(2)} USD`, 10, 85);
            doc.text(`LIBELLÉ : Frais Scolaires 2026`, 10, 95);
            
            doc.setDrawColor(200, 200, 200);
            doc.line(10, 110, 90, 110);
            
            doc.setFontSize(7);
            doc.text("Le comptable a reçu le montant susmentionné.", 50, 125, { align: "center" });
            doc.setFontSize(9);
            doc.text("CACHET DE L'ÉTABLISSEMENT", 50, 140, { align: "center" });

            doc.save(`Recu_${studentName.replace(/\s/g, '_')}.pdf`);
        }

        function triggerKick(name) {
            // Simulation d'envoi vers le module Sécurité/Discipline
            console.log(`ALERTE : Refoulement requis pour ${name}`);
            alert(`Alerte envoyée au Directeur de Discipline pour ${name}.`);
        }

        function updateKPIs() {
            const totalRecouvre = students.reduce((acc, s) => acc + s.paid, 0);
            const totalAttendu = students.length * config.totalFees;
            
            document.getElementById('total-cash').innerText = totalRecouvre.toFixed(2) + " $";
            document.getElementById('rate-cash').innerText = Math.round((totalRecouvre / totalAttendu) * 100) + "%";
            document.getElementById('kick-count').innerText = students.filter(s => (s.total - s.paid) > 0).length;
        }

        function closeModal() { document.getElementById('pay-modal').style.display = 'none'; }
    </script>
</body>
</html>
