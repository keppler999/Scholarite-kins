<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scholarite | Comptabilité & Trésorerie</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --navy: #0F172A;
            --gold: #B45309;
            --emerald: #059669;
            --bg: #F1F5F9;
            --white: #FFFFFF;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; }

        .sidebar { width: 240px; background: var(--navy); height: 100vh; color: white; padding: 25px; position: fixed; }
        .main-content { margin-left: 290px; padding: 40px; width: calc(100% - 350px); }

        /* Formulaire de caisse */
        .caisse-box { 
            background: var(--white); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border-left: 8px solid var(--emerald);
        }

        .input-group { display: flex; gap: 15px; margin-top: 15px; }
        input { flex: 1; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; outline: none; font-size: 15px; }
        input:focus { border-color: var(--gold); }

        .btn-valider { 
            background: var(--emerald); color: white; border: none; padding: 12px 25px; 
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-valider:hover { background: #064E3B; transform: translateY(-2px); }

        /* Table des paiements */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; }
        th { background: #F8FAFC; color: var(--navy); padding: 15px; text-align: left; border-bottom: 2px solid #E2E8F0; }
        td { padding: 15px; border-bottom: 1px solid #F1F5F9; }

        .btn-print { 
            background: #E2E8F0; border: none; padding: 8px 12px; border-radius: 6px; 
            cursor: pointer; font-size: 12px; font-weight: bold; 
        }
        .btn-print:hover { background: var(--navy); color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: var(--gold);"><i class="fa-solid fa-wallet"></i> Scholarite</h2>
        <p style="font-size: 11px; color: #94A3B8;">TRÉSORERIE & COMPTABILITÉ</p>
        <hr style="border: 0.5px solid #1E293B; margin: 20px 0;">
        <div style="cursor:pointer;"><i class="fa-solid fa-cash-register"></i> Encaissements</div>
        <div style="margin-top:20px; cursor:pointer; color: #94A3B8;"><i class="fa-solid fa-file-invoice-dollar"></i> Rapports Journaliers</div>
    </div>

    <div class="main-content">
        <div class="header" style="margin-bottom: 30px;">
            <h1 style="margin:0;">Gestion des Frais Scolaires</h1>
            <p style="color: #64748B;">Saisie des paiements et génération de reçus PDF</p>
        </div>

        <div class="caisse-box">
            <h3 style="margin:0;"><i class="fa-solid fa-plus-circle"></i> Nouvel Encaissement</h3>
            <div class="input-group">
                <input type="text" id="nomEleve" placeholder="Nom complet de l'élève">
                <input type="number" id="montantPaye" placeholder="Montant (FC)">
                <input type="text" id="motif" placeholder="Motif (ex: Minerval)">
                <button class="btn-valider" onclick="enregistrerEtImprimer()">
                    <i class="fa-solid fa-check"></i> VALIDER & REÇU
                </button>
            </div>
        </div>

        <div style="background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Flux de Caisse Récent</h3>
            <table id="tableFinances">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Élève</th>
                        <th>Montant</th>
                        <th>Motif</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="corpsTableau">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = "https://chpydetdbfugwwhsvgin.supabase.co"; 
        const SUPABASE_KEY = "Sb_publishable_G3rNGdnIihPNVfaLj1C4VQ_1TUBFh_z"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. FONCTION : ENREGISTRER DANS SUPABASE + IMPRIMER
        async function enregistrerEtImprimer() {
            const nom = document.getElementById('nomEleve').value;
            const montant = document.getElementById('montantPaye').value;
            const motif = document.getElementById('motif').value || 'Frais Scolaires';

            if(!nom || !montant) return alert("Veuillez remplir au moins le nom et le montant.");

            // Enregistrement
            const { error } = await supabase
                .from('finances')
                .insert([{ nom_eleve: nom, montant_paye: montant, motif_paiement: motif }]);

            if(error) {
                alert("Erreur base de données : " + error.message);
            } else {
                genererPDF(nom, montant, motif);
                document.getElementById('nomEleve').value = "";
                document.getElementById('montantPaye').value = "";
                chargerHistorique();
            }
        }

        // 2. FONCTION : GÉNÉRER LE REÇU PDF
        function genererPDF(nom, montant, motif) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // En-tête du reçu
            doc.setFont("helvetica", "bold");
            doc.text("COLLEGE MARANATHA - KINSHASA", 105, 20, null, null, "center");
            doc.setFontSize(10);
            doc.text("Logiciel Scholarite - Reçu de Caisse Officiel", 105, 28, null, null, "center");
            
            // Ligne de séparation
            doc.line(20, 35, 190, 35);

            // Corps du reçu
            doc.setFontSize(12);
            doc.setFont("helvetica", "normal");
            doc.text(`Date : ${new Date().toLocaleString()}`, 20, 45);
            doc.text(`Élève : ${nom}`, 20, 55);
            doc.text(`Montant payé : ${montant} FC`, 20, 65);
            doc.text(`Motif : ${motif}`, 20, 75);

            // Signature
            doc.setFont("helvetica", "italic");
            doc.text("Le Comptable,", 150, 100);
            doc.text("Signature & Cachet", 145, 120);

            doc.save(`Recu_${nom.replace(/\s+/g, '_')}.pdf`);
        }

        // 3. FONCTION : CHARGER L'HISTORIQUE
        async function chargerHistorique() {
            const { data, error } = await supabase
                .from('finances')
                .select('*')
                .order('date_paiement', { ascending: false })
                .limit(10);

            if (data) {
                const tbody = document.getElementById('corpsTableau');
                tbody.innerHTML = "";
                data.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${new Date(p.date_paiement).toLocaleDateString()}</td>
                        <td><strong>${p.nom_eleve}</strong></td>
                        <td>${Number(p.montant_paye).toLocaleString()} FC</td>
                        <td>${p.motif_paiement}</td>
                        <td><button class="btn-print" onclick="genererPDF('${p.nom_eleve}', '${p.montant_paye}', '${p.motif_paiement}')"><i class="fa-solid fa-print"></i> RE-IMPRIMER</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        window.onload = chargerHistorique;
    </script>
</body>
</html>
