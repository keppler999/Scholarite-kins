<!DOCTYPE html>
<html lang="fr">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #0F172A;
            --gold: #B45309;
            --crimson: #BE123C;
            --emerald: #059669;
            --bg: #F1F5F9;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; }

        .sidebar { width: 240px; background: var(--navy); height: 100vh; color: white; padding: 25px; position: fixed; }
        .main-content { margin-left: 290px; padding: 40px; width: calc(100% - 350px); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-bottom: 4px solid var(--gold); }
        .stat-card h4 { margin: 0; color: var(--slate); font-size: 12px; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: 800; color: var(--navy); }

        .search-bar { width: 100%; padding: 15px; border: 1px solid #E2E8F0; border-radius: 10px; margin-bottom: 20px; font-size: 16px; outline: none; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        th { background: #F8FAFC; color: var(--navy); padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #F1F5F9; }

        .status-paid { color: var(--emerald); font-weight: bold; }
        .status-debt { color: var(--crimson); font-weight: bold; }

        .btn-pay { background: var(--navy); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-pay:hover { background: var(--gold); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Scholarite</h3>
        <p style="font-size: 11px; color: #94A3B8; letter-spacing: 1px;">TRÉSORERIE CENTRALE</p>
        <hr style="border: 0.5px solid #1E293B; margin: 20px 0;">
        <div style="cursor:pointer; color: #white;"><i class="fa-solid fa-wallet"></i> Encaissements</div>
        <div style="margin-top:20px; cursor:pointer; color: #94A3B8;"><i class="fa-solid fa-file-invoice"></i> Rapports</div>
    </div>

    <div class="main-content">
        <div class="stats-grid">

            </div>
            <div class="stat-card">
                <h4>Reste à Recouvrer</h4>

            <div class="stat-card">
                <h4>Taux de Solvabilité</h4>

        </div>

        <input type="text" class="search-bar" placeholder="Rechercher un élève par nom ou matricule...">

        <table>
            <thead>
                <tr>
                    <th>ÉLÈVE</th>
                    <th>CLASSE</th>
                    <th>FRAIS TOTAL</th>
                    <th>PAYÉ</th>
                    <th>SOLDE</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Kambale Kepler</strong></td>
                    <td>3ème Électricité</td>
                    <td>$450</td>
                    <td>$450</td>
                    <td class="status-paid">SOLDE</td>
                    <td><button class="btn-pay"><i class="fa-solid fa-print"></i> REÇU</button></td>
                </tr>
                <tr>
                    <td><strong>Kavira Masika</strong></td>
                    <td>3ème Électricité</td>
                    <td>$450</td>
                    <td>$200</td>
                    <td class="status-debt">-$250</td>
                    <td><button class="btn-pay">ENCAISSER</button></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
