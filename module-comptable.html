<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum ERP | Comptabilité Souveraine</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap');

        :root {
            --gold: #B45309;
            --bg: #020617;
            --panel: #0F172A;
            --success: #10B981;
            --danger: #EF4444;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR DYNAMIQUE --- */
        .sidebar {
            width: 280px; background: #000; border-right: 1px solid var(--border);
            padding: 30px; display: flex; flex-direction: column;
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .logo-box { width: 45px; height: 45px; border-radius: 12px; background: var(--panel); object-fit: contain; }

        .nav-link {
            padding: 15px; border-radius: 12px; color: #64748B; cursor: pointer;
            display: flex; align-items: center; gap: 15px; transition: 0.3s; margin-bottom: 8px;
        }
        .nav-link.active, .nav-link:hover { background: rgba(180, 83, 9, 0.1); color: var(--gold); }

        /* --- MAIN INTERFACE --- */
        .content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .kpi-card { background: var(--panel); padding: 25px; border-radius: 20px; border: 1px solid var(--border); position: relative; }
        .kpi-card::after { content: ''; position: absolute; left: 0; top: 25%; height: 50%; width: 4px; background: var(--gold); border-radius: 0 4px 4px 0; }
        .kpi-card small { color: #64748B; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .kpi-card h2 { font-family: 'JetBrains Mono'; margin-top: 10px; font-size: 22px; }

        /* --- TABLEAU DES OPÉRATIONS --- */
        .workspace { background: var(--panel); border-radius: 24px; padding: 30px; border: 1px solid var(--border); }
        .search-bar { width: 100%; background: #000; border: 1px solid #1E293B; padding: 15px; border-radius: 12px; color: white; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #64748B; font-size: 12px; border-bottom: 1px solid var(--border); }
        td { padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 14px; }

        /* --- ACTIONS --- */
        .btn { padding: 8px 15px; border-radius: 8px; cursor: pointer; border: none; font-weight: 700; font-size: 12px; transition: 0.2s; }
        .btn-pay { background: var(--success); color: white; }
        .btn-kick { background: var(--danger); color: white; margin-left: 5px; }
        .btn-pdf { background: #1E293B; color: white; margin-right: 5px; }

        /* --- MODAL PAIEMENT --- */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--panel); padding: 40px; border-radius: 28px; width: 450px; border: 1px solid var(--gold); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img id="side-logo" src="" class="logo-box">
            <div>
                <h3 id="side-sch-name" style="font-size: 14px;">SCHOLARITE</h3>
                <small style="color: var(--gold)">Module Comptable</small>
            </div>
        </div>
        <div class="nav-link active"><i class="fa-solid fa-cash-register"></i> Caisse Directe</div>
        <div class="nav-link"><i class="fa-solid fa-list-check"></i> État des Tranches</div>
        <div class="nav-link"><i class="fa-solid fa-building-columns"></i> Dépenses École</div>
        <div class="nav-link"><i class="fa-solid fa-file-pdf"></i> Rapports de Clôture</div>
    </aside>

    <main class="content">
        <div class="kpi-grid">
            <div class="kpi-card"><small>Encaissement Jour</small><h2 id="day-cash">0.00 $</h2></div>
            <div class="kpi-card"><small>Total Recouvré</small><h2 id="total-cash">0.00 $</h2></div>
            <div class="kpi-card"><small>Taux de Solvabilité</small><h2 id="rate-cash">0%</h2></div>
            <div class="kpi-card"><small>Élèves à Refouler</small><h2 id="kick-count" style="color: var(--danger)">0</h2></div>
        </div>

        <div class="workspace">
            <input type="text" class="search-bar" placeholder="Scanner matricule ou nom de l'élève...">
            <table>
                <thead>
                    <tr>
                        <th>NOM DE L'ÉLÈVE</th>
                        <th>CLASSE</th>
                        <th>SOLDE PAYÉ</th>
                        <th>RESTE</th>
                        <th>STATUS</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="registry">
                    </tbody>
            </table>
        </div>
    </main>

    <div class="overlay" id="pay-modal">
        <div class="modal">
            <h2 style="margin-bottom: 10px;">Enregistrer un Versement</h2>
            <p id="target-student" style="color: var(--gold); margin-bottom: 30px; font-weight: 800;"></p>
            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 11px; color: #64748B;">MONTANT VERSE (USD)</label>
                <input type="number" id="cash-in" style="width:100%; padding:15px; background:#000; border:1px solid #1E293B; color:white; border-radius:12px; margin-top:10px; font-size:20px;">
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn-pay" style="flex-grow: 1; padding: 15px;" onclick="processPayment()">VALIDER & GÉNÉRER REÇU</button>
                <button class="btn" style="background:#1E293B; color:white;" onclick="closeModal()">ANNULER</button>
            </div>
        </div>
    </div>

    <script>
        // --- DONNÉES GLOBALES ---
        let currentConfig = JSON.parse(localStorage.getItem('platinum_config')) || {};
        let activeStudent = null;

        const students = [
            { id: 1, name: "KABAMBA Marc", class: "3e Électricité", paid: 150, total: 450 },
            { id: 2, name: "MUKENDI Alice", class: "3e Électricité", paid: 450, total: 450 },
            { id: 3, name: "TSHIMANGA David", class: "4e Commerciale", paid: 50, total: 450 }
        ];

        // --- INITIALISATION ---
        window.onload = () => {
            document.getElementById('side-logo').src = currentConfig.logo || '';
            document.getElementById('side-sch-name').innerText = (currentConfig.schoolName || 'PLATINUM').toUpperCase();
            renderRegistry();
            updateKPIs();
        };

        function renderRegistry() {
            const tbody = document.getElementById('registry');
            tbody.innerHTML = students.map(s => {
                const rest = s.total - s.paid;
                const status = rest <= 0 ? '<span style="color:var(--success)">SOLVABLE</span>' : '<span style="color:var(--danger)">DETTE</span>';
                return `
                    <tr>
                        <td><b>${s.name}</b></td>
                        <td>${s.class}</td>
                        <td>${s.paid}.00 $</td>
                        <td>${rest}.00 $</td>
                        <td>${status}</td>
                        <td>
                            <button class="btn btn-pdf" onclick="generateReceipt('${s.name}', 0, true)">📜</button>
                            <button class="btn btn-pay" onclick="openPay('${s.name}', ${s.id})">PAYER</button>
                            <button class="btn btn-kick" onclick="triggerKick('${s.name}')">REFOULEMENT</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- LOGIQUE PDF (GÉNÉRATION DE REÇU) ---
        function generateReceipt(studentName, amount, isDuplicate = false) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const date = new Date().toLocaleString();

            // Design du reçu
            doc.setFillColor(18, 23, 42); 
            doc.rect(0, 0, 210, 40, 'F');
            
            doc.setTextColor(180, 83, 9);
            doc.setFontSize(22);
            doc.text(currentConfig.schoolName || "PLATINUM ERP", 20, 25);
            
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(16);
            doc.text("REÇU DE PAIEMENT N°" + Math.floor(Math.random()*10000), 20, 60);
            
            doc.setFontSize(12);
            doc.text(`Date: ${date}`, 20, 75);
            doc.text(`Élève: ${studentName}`, 20, 90);
            doc.text(`Montant versé: ${amount} $`, 20, 105);
            
            doc.setDrawColor(180, 83, 9);
            doc.line(20, 120, 190, 120);
            
            doc.setFontSize(10);
            doc.text("Signature Comptabilité", 150, 150);
            doc.text("Cachet de l'École", 20, 150);

            doc.save(`Recu_${studentName.replace(' ', '_')}.pdf`);
        }

        // --- ACTIONS ---
        function openPay(name, id) {
            activeStudent = students.find(s => s.id === id);
            document.getElementById('target-student').innerText = name;
            document.getElementById('pay-modal').style.display = 'flex';
        }

        function processPayment() {
            const val = parseFloat(document.getElementById('cash-in').value);
            if(!val) return;
            
            activeStudent.paid += val;
            generateReceipt(activeStudent.name, val);
            closeModal();
            renderRegistry();
            updateKPIs();
        }

        function triggerKick(name) {
            // Lien direct avec le module de discipline (via localStorage pour la démo)
            let kicks = JSON.parse(localStorage.getItem('kick_list')) || [];
            kicks.push({ name, time: new Date().toLocaleTimeString() });
            localStorage.setItem('kick_list', JSON.stringify(kicks));
            alert(`Alerte de refoulement envoyée pour ${name}`);
        }

        function updateKPIs() {
            const total = students.reduce((acc, curr) => acc + curr.paid, 0);
            document.getElementById('total-cash').innerText = total + ".00 $";
            document.getElementById('rate-cash').innerText = Math.round((total / (students.length * 450)) * 100) + "%";
            document.getElementById('kick-count').innerText = students.filter(s => (s.total - s.paid) > 0).length;
        }

        function closeModal() { document.getElementById('pay-modal').style.display = 'none'; }
    </script>
</body>
</html>
